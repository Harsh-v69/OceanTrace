# Alembic configuration for OceanTrace (Epic 4.1).
#
#   alembic upgrade head              # apply migrations
#   alembic revision --autogenerate -m "msg"
#   alembic check                     # models vs migrations drift check
#
# The database URL is read from the app settings in alembic/env.py
# (sqlalchemy.url below is a harmless placeholder / override).

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
version_path_separator = os
sqlalchemy.url = sqlite:///./data/app.db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
